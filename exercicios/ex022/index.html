<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio de fundo de imagens</title>
</head>
<style>
    .pai{
        display: flex;
        gap: 20px;
    }
    .quadrado{
        border: solid 2px black;
        width: 300px;
        height: 300px;
        justify-content: center; 
        display: flex;
        align-items: center;
        
    }
    body{
        background-image: url(imagens/wallpaper001.jpg);
        display: flex;
        justify-content: center;
        align-items: center;
    }
    div#q01{
        background-image: url(imagens/pattern001.png);
    }
    div#q02{
        background-image: linear-gradient(to bottom, #090909 20%,#f70000);
    }
    div#q03{
        background-image: url(imagens/wallpaper005.jpg);
    }
</style>
<body>
    <div class="pai">
        <div class="quadrado" id="q01"></div>
        <div class="quadrado" id="q02"></div>
        <div class="quadrado" id="q03"></div>
    </div>

    
</body>
</html>
