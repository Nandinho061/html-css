<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    .foto {
    position: relative;
    width: 300px;
}

.foto img {
    width: 100%;
    position: absolute;
    top: 200px;
    left: 300px;
}

.foto span {
    position: absolute;
    top: 10px;
    right: 10px;

    background-color: red;
    color: white;
    padding: 5px;
}
</style>
<body>

    <div class="foto">
    <img src="../loja-informatica-copia/mouse.png">
    <span>Promoção</span>
</div>
    
</body>
</html>
