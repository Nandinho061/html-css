<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            border-collapse: collapse;
            
            
        }
        tr th,td{
            border: solid 1px black; 
            width: 100px;
            padding: 10px;
        }
    </style>
</head>
<body>
    <table>
        <h1>Tabela De Filmes</h1>
        <thead>
            <tr>
                <th scope="col">Grupos</th>
                <th scope="col">Nomes</th>
                <th colspan="3" scope="colgroup">Filmes</th>
            </tr>
            
        </thead>
        <tbody>
            <tr>
                <th rowspan="3" scope="rowgroup">Mulheres</th>
                <td>Ana Beatriz</td>
                <td>Alien</td>
                <td>Rambo</td>
                <td>Bairro 13</td>
            </tr>
            <tr>
                <td>Ana Luiza</td>
                <td>Hulk</td>
                <td>Inception</td>
                <td>Batman</td>
                
            </tr>
            <tr>
                <td>Stefania</td>
                <td>Naruto</td>
                <td>Dragon</td>
                <td>Apalosa</td>

            </tr>
            <tr>
                <th rowspan="3" scope="rowgroup">Homens</th>
                <td>Nandinho</td>
                <td>jack sham</td>
                <td>pele</td>
                <td>Harvert</td>
            </tr>
            <tr>
                <td>Pedro</td>
                <td>Robot</td>
                <td>Freefire</td>
                <td>Gta5</td>
            </tr>
            <tr>
                <td>David</td>
                <td>Green Hell</td>
                <td>BlockStory</td>
                <td>Pes6</td>
            </tr>
             
        </tbody>
    </table>
    
</body>
</html>
